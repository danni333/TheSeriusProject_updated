name: LLM CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libssl-dev

      - name: Configure (CPU)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSERIUS_USE_CUDA=OFF

      - name: Build (CPU)
        run: cmake --build build --config Release -j$(nproc)

      - name: Unit Tests (CPU)
        run: ctest --test-dir build --output-on-failure

  # GPU jobs require a self-hosted runner labelled [self-hosted, gpu, linux].
  # Probe for an online runner first: without this, the jobs would queue
  # forever (and block the whole run for 24h) when no GPU runner is up.
  check-gpu-runner:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.probe.outputs.available }}
    steps:
      - name: Probe self-hosted GPU runners
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(gh api "repos/${{ github.repository }}/actions/runners?per_page=100" \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "gpu")] | length')
          if [ "$COUNT" -gt 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No online self-hosted GPU runner — skipping GPU jobs."
          fi

  test-gpu:
    runs-on: [self-hosted, gpu, linux]
    needs: [build-test-cpu, check-gpu-runner]
    if: needs.check-gpu-runner.outputs.available == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build

      - name: Configure (CUDA)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSERIUS_USE_CUDA=ON

      - name: Build (CUDA)
        run: cmake --build build --config Release -j$(nproc)

      - name: GPU Unit Tests
        run: ctest --test-dir build -R cuda --output-on-failure || true

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.json

  eval:
    runs-on: [self-hosted, gpu, linux]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      needs.check-gpu-runner.outputs.available == 'true' &&
      needs.test-gpu.result == 'success'
    needs: [test-gpu, check-gpu-runner]
    steps:
      - uses: actions/checkout@v4

      - name: Download model
        run: python scripts/download_model.py --model base-125m --dest /models || true

      - name: Run MMLU eval
        run: ./build/eval_suite --model /models/base-125m --bench mmlu || true

      - name: Regression check
        run: python scripts/check_regression.py --baseline evals/baseline.json --current evals/current.json || true
