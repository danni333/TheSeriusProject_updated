name: LLM CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build libssl-dev

      - name: Configure (CPU)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSERIUS_USE_CUDA=OFF

      - name: Build (CPU)
        run: cmake --build build --config Release -j$(nproc)

      - name: Unit Tests (CPU)
        run: ctest --test-dir build --output-on-failure
