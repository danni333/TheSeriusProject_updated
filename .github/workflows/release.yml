name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libspdlog-dev nlohmann-json3-dev
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
      - name: Package
        run: |
          cd build
          tar czf serius-linux-x64.tar.gz serius
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/serius-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          choco install cmake
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
      - name: Package
        run: |
          Compress-Archive -Path build\Release\serius.exe -DestinationPath serius-windows-x64.zip
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: serius-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install cmake spdlog nlohmann-json
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)
      - name: Package
        run: |
          cd build
          tar czf serius-macos-arm64.tar.gz serius
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/serius-macos-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
