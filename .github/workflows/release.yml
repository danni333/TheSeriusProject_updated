name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libspdlog-dev nlohmann-json3-dev
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
      - name: Package
        run: |
          mkdir -p dist
          cp build/serius dist/
          cp -r ui dist/ui
          tar czf serius-linux-x64.tar.gz -C dist .
          sha256sum serius-linux-x64.tar.gz > serius-linux-x64.tar.gz.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            serius-linux-x64.tar.gz
            serius-linux-x64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libspdlog-dev nlohmann-json3-dev
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(nproc)
      - name: Package
        run: |
          mkdir -p dist
          cp build/serius dist/
          cp -r ui dist/ui
          tar czf serius-linux-arm64.tar.gz -C dist .
          sha256sum serius-linux-arm64.tar.gz > serius-linux-arm64.tar.gz.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            serius-linux-arm64.tar.gz
            serius-linux-arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: choco install cmake
      - name: Build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\serius.exe dist\
          Copy-Item -Recurse ui dist\ui
          Compress-Archive -Path dist\* -DestinationPath serius-windows-x64.zip
          $hash = (Get-FileHash serius-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  serius-windows-x64.zip" | Out-File -Encoding ascii serius-windows-x64.zip.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            serius-windows-x64.zip
            serius-windows-x64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          brew install cmake spdlog nlohmann-json
      - name: Build
        run: |
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . -j$(sysctl -n hw.ncpu)
      - name: Package
        run: |
          mkdir -p dist
          cp build/serius dist/
          cp -r ui dist/ui
          tar czf serius-macos-arm64.tar.gz -C dist .
          shasum -a 256 serius-macos-arm64.tar.gz > serius-macos-arm64.tar.gz.sha256
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            serius-macos-arm64.tar.gz
            serius-macos-arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
