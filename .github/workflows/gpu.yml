name: GPU CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gpu-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Self-hosted GPU runner auto-detection without extra PATs:
  # GITHUB_TOKEN cannot read /actions/runners, but it CAN read job status
  # of the current run and cancel it if no GPU runner picks up test-gpu.
  watchdog:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel run if no GPU runner picks up test-gpu
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 6); do
            sleep 10
            STATUS=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '.jobs[] | select(.name == "test-gpu") | .status')
            if [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "completed" ]; then
              echo "GPU runner picked up the job ($STATUS)."
              exit 0
            fi
          done
          echo "::notice::No online self-hosted GPU runner after 60s — cancelling GPU run."
          gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"

  test-gpu:
    runs-on: [self-hosted, gpu, linux]
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ninja-build
      - name: Configure (CUDA)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSERIUS_USE_CUDA=ON
      - name: Build (CUDA)
        run: cmake --build build --config Release -j$(nproc)
      - name: GPU Unit Tests
        run: ctest --test-dir build -R cuda --output-on-failure || true
      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results.json

  eval:
    runs-on: [self-hosted, gpu, linux]
    needs: [test-gpu]
    if: github.ref == 'refs/heads/main' && needs.test-gpu.result == 'success'
    steps:
      - uses: actions/checkout@v6
      - name: Download model
        run: python scripts/download_model.py --model base-125m --dest /models || true
      - name: Run MMLU eval
        run: ./build/eval_suite --model /models/base-125m --bench mmlu || true
      - name: Regression check
        run: python scripts/check_regression.py --baseline evals/baseline.json --current evals/current.json || true
